location:
  name: "Costa vasca — Zarautz a Donostia"
  bbox: [-2.20, 43.25, -1.90, 43.40]   # [lon_min, lat_min, lon_max, lat_max]

dates:
  start: "2024-01-01"
  end:   "2025-12-31"

satellite:
  sensor:        "Sentinel-2"
  product_level: "L2A"
  max_cloud_pct: 30
  tile:          "T30TWN"    # tile Sentinel-2 que cubre Zarautz-Donostia

indices: ["NDVI", "NDWI", "MNDWI"]

classifier:
  classes:         ["agua", "vegetacion", "urbano", "litoral"]
  model:           "random_forest"
  labels_path:     "data/labels/costa_vasca_labels.geojson"
  reference_scene: "20241228"    # fecha de la escena usada para etiquetar en QGIS
  block_size_m:    500           # tamaño de bloque para el split espacial train/test
  test_size:       0.25
  random_state:    42

anomaly_detector:
  method:          "statistical"
  window_days:     30
  threshold_sigma: 2.0
