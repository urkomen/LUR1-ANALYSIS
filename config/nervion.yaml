location:
  name: "Ría del Nervión — Bilbao y alrededores"
  bbox: [-3.10, 43.15, -2.90, 43.40]   # [lon_min, lat_min, lon_max, lat_max] — ~20×25 km

dates:
  start: "2024-01-01"
  end:   "2025-12-31"

satellite:
  sensor:        "Sentinel-2"
  product_level: "L2A"
  max_cloud_pct: 30
  tile:          "T30TWN"    # mismo tile que Costa Vasca

indices: ["NDVI", "NDWI", "MNDWI"]

processing:
  max_bbox_cloud_pct:   50
  min_ref_scenes:       5

classifier:
  model_name: "rf_prod"    # modelo entrenado en Costa Vasca

anomaly_detector:
  window_days:     45      # referencia estacional: ±45 días, agrupando todos los años
  threshold_sigma: 2.0
