name: lur1
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - gdal
  - libgdal-jp2openjpeg
  - rasterio
  - geopandas
  - pyproj
  - shapely
  - fiona
  - numpy
  - pandas
  # Fijadas: el repositorio distribuye un modelo serializado
  # (data/models/production/rf_prod.joblib) con joblib. Las versiones de
  # deserializacion no son estables entre releases de scikit-learn; sin fijar,
  # una instalacion futura podria cargarlo con avisos o fallar directamente.
  - scikit-learn=1.9.0
  - matplotlib
  - joblib=1.5.3
  - pyyaml
  - jupyter
  - ipykernel
  - requests
  - pip
